apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-live-api
  labels:
    app: live-api
spec:
  replicas: 4
  selector:
    matchLabels:
      app: live-api
  template:
    metadata:
      labels:
        app: live-api
    spec:
      containers:
      - name: web
        image: nginxdemos/hello:plain-text
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: my-live-api-svc
spec:
  type: NodePort
  selector:
    app: live-api
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30500

