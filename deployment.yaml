apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-live-api
  labels:
    app: live-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: live-api
  template:
    metadata:
      labels:
        app: live-api
    spec:
      containers:
      - name: auth_api
        image: chocobar/auth-api:latest
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"


